<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>terran</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="menu" class="screen hidden">
  <h1>terran</h1>
  <p class="sub">Five places. Guess where they are.</p>

  <div id="challenge-card" class="card hidden">
    <div><b>Challenge</b><span id="challenge-text"></span></div>
    <button id="challenge-skip" class="link">skip</button>
    <button id="challenge-btn" class="primary">Play</button>
  </div>
  <div id="daily-card" class="card">
    <div><b>Daily</b><span id="daily-text"></span></div>
    <button id="daily-btn" class="primary">Play</button>
  </div>

  <div id="themes"></div>
  <div class="setting"><span>time limit</span><div id="time-limits" class="segmented"></div></div>
  <div class="modes">
    <button data-mode="move"><b>Move</b><span>look around, walk anywhere</span></button>
    <button data-mode="nm"><b>No move</b><span>look around and zoom</span></button>
    <button data-mode="nmpz"><b>Still</b><span>one photo, nothing else</span></button>
  </div>
  <button id="change-key" class="link">change api key</button>
</section>

<section id="keyscreen" class="screen hidden">
  <h1>terran</h1>
  <p class="sub">Paste a Google Maps API key with the <b>Maps JavaScript API</b> enabled.<br>It is stored only in this browser.</p>
  <p id="key-error" class="error hidden"></p>
  <form id="key-form">
    <input id="key-input" placeholder="AIza…" autocomplete="off" spellcheck="false" required>
    <button>Save</button>
  </form>
</section>

<section id="game" class="hidden">
  <div id="pano"></div>
  <div id="freeze" class="hidden"></div>

  <div id="hud">
    <span id="hud-theme"></span>
    <span id="hud-round"></span>
    <span id="hud-score"></span>
    <span id="hud-timer" class="hidden"></span>
    <button id="quit" class="link">menu</button>
  </div>
  <div id="walk-controls" class="hidden">
    <button id="to-start" title="Back to start (R)">back to start</button>
    <button id="undo" title="Undo last move (Z)">undo</button>
  </div>

  <div id="guess-box">
    <div id="map"></div>
    <button id="guess-btn" disabled>Place your guess</button>
  </div>

  <div id="result" class="hidden">
    <div id="result-bar">
      <div id="result-text"></div>
      <div id="result-actions"></div>
    </div>
  </div>

  <div id="loading" class="hidden">finding a place…</div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
