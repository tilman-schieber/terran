<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>terran</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%230f1012'/%3E%3Cg fill='none' stroke='%23e9e9ea' stroke-width='2.6' stroke-linecap='round'%3E%3Ccircle cx='24' cy='24' r='17'/%3E%3Cellipse cx='24' cy='24' rx='7.5' ry='17'/%3E%3Cpath d='M7 24h34M9.3 15.5h29.4M9.3 32.5h29.4'/%3E%3C/g%3E%3Ccircle cx='30.5' cy='16.5' r='4.2' fill='%23ff5a36'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=__VERSION__">
</head>
<body>

<section id="menu" class="screen hidden">
  <svg id="globe" width="72" height="72" aria-hidden="true"></svg>
  <h1>terran</h1>
  <p class="sub">Five places. Guess where they are.</p>

  <div id="challenge-card" class="card hidden">
    <div><b>Challenge</b><span id="challenge-text"></span></div>
    <button id="challenge-skip" class="link">skip</button>
    <button id="challenge-btn" class="primary">Play</button>
  </div>
  <button id="play" class="hero">
    <span id="play-icon"></span>
    <span class="hero-text"><b>Play</b><span id="play-text"></span></span>
  </button>

  <div id="daily-card" class="card">
    <span id="daily-icon" class="card-icon"></span>
    <div><b>Daily</b><span id="daily-text"></span></div>
    <button id="daily-btn" class="primary">Play</button>
  </div>

  <div id="presets"></div>

  <button id="open-custom" class="link-row"><span id="custom-icon"></span>custom game</button>
</section>

<section id="custom" class="screen hidden">
  <h2>Custom game</h2>
  <div class="setting"><span>where</span></div>
  <div id="themes"></div>
  <div class="setting"><span>mode</span><div id="modes" class="segmented"></div></div>
  <p id="mode-hint" class="hint"></p>
  <div class="setting"><span>time limit</span><div id="time-limits" class="segmented"></div></div>
  <div class="actions">
    <button id="custom-back" class="link">back</button>
    <button id="custom-start" class="primary">Start</button>
  </div>
</section>

<section id="keyscreen" class="screen hidden">
  <h1>terran</h1>
  <p class="sub">Paste a Google Maps API key with the <b>Maps JavaScript API</b> enabled.<br>It is stored only in this browser.</p>
  <p id="key-error" class="error hidden"></p>
  <form id="key-form">
    <input id="key-input" placeholder="AIza…" autocomplete="off" spellcheck="false" required>
    <button>Save</button>
  </form>
</section>

<section id="game" class="hidden">
  <div id="pano"></div>
  <div id="freeze" class="hidden"></div>

  <div id="hud">
    <span id="hud-theme"></span>
    <span id="hud-round"></span>
    <span id="hud-score"></span>
    <span id="hud-timer" class="hidden"></span>
    <button id="quit" class="link">menu</button>
  </div>
  <div id="walk-controls" class="hidden">
    <button id="to-start" title="Back to start (R)">back to start</button>
    <button id="undo" title="Undo last move (Z)">undo</button>
  </div>

  <div id="guess-box">
    <div id="map"></div>
    <button id="guess-btn" disabled>Place your guess</button>
  </div>

  <div id="result" class="hidden">
    <div id="result-bar">
      <div id="result-text"></div>
      <div id="result-actions"></div>
    </div>
  </div>

  <div id="loading" class="hidden">finding a place…</div>
</section>

<!-- __VERSION__ is replaced with the commit on deploy, so a page never mixes cached files from two versions -->
<script type="importmap">
{
  "imports": {
    "./config.js": "./config.js?v=__VERSION__",
    "./regions.js": "./regions.js?v=__VERSION__",
    "./places.js": "./places.js?v=__VERSION__",
    "./themes.js": "./themes.js?v=__VERSION__",
    "./globe.js": "./globe.js?v=__VERSION__",
    "./icons.js": "./icons.js?v=__VERSION__"
  }
}
</script>
<script type="module" src="app.js?v=__VERSION__"></script>
</body>
</html>
